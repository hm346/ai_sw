<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        //创建一个空对象
        //Object是顶层对象
        //Object 
        // const zzd =new Object();
        // console.log(zzd);
        function Person(name,age){
            console.log(this);
            this.name=name;
            this.age=age;
        }
        //原型对象上的方法是公用的
        Person.prototype.say =function(){
            console.log(`我叫${this.name}`);
        }

         Person.prototype.time =function(){
            console.log(`时间`);
        }

        const zwy =new Person('zwy',18);
        console.log(zwy.toString());
    </script>
</body>
